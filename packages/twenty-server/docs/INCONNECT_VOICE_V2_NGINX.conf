# Include this file inside the dedicated DEV-LOCAL-R1 server on 127.0.0.1:34080.
location = /auth/inconnect-voice/inbound {
    if ($request_method != POST) {
        return 405;
    }
    if ($request !~ "^POST /auth/inconnect-voice/inbound HTTP/1[.][01]$") {
        return 404;
    }
    client_max_body_size 16k;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:33000;
    proxy_set_header Connection close;
    proxy_pass_request_headers on;
    proxy_pass_request_body on;
    proxy_pass http://127.0.0.1:33000;
}

location = /auth/inconnect-voice/inbound-progress {
    if ($request_method != POST) {
        return 405;
    }
    if ($request !~ "^POST /auth/inconnect-voice/inbound-progress([?]id=[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}&parent=CA[0-9a-fA-F]{32}&source=(dial|client|screen))? HTTP/1[.][01]$") {
        return 404;
    }
    client_max_body_size 16k;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:33000;
    proxy_set_header Connection close;
    proxy_pass_request_headers on;
    proxy_pass_request_body on;
    proxy_pass http://127.0.0.1:33000;
}
